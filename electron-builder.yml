appId: com.grudgevault.desktop
productName: Grudge Vault
copyright: Copyright © 2026 Grudge Vault contributors
asar: true
npmRebuild: true
# Nested app dependency installation must not re-run this workspace's postinstall.
# electron-builder explicitly rebuilds native modules after that installation.
npmArgs:
  - --ignore-scripts
directories:
  app: apps/desktop
  output: release
files:
  - out/**/*
  - package.json
extraMetadata:
  main: out/main/index.js
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
mac:
  extraResources:
    - from: apps/desktop/build/native/grudge-vault-media
      to: bin/grudge-vault-media
  category: public.app-category.productivity
  icon: apps/desktop/build/icon.icns
  target:
    - dmg
    - zip
  identity: null
win:
  target:
    - nsis
linux:
  executableName: grudge-vault
  category: Utility
  target:
    - AppImage
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
appImage:
  artifactName: "${productName}-${version}-linux-x64.${ext}"
