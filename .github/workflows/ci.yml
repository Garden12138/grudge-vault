name: CI and cross-platform packaging

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:packaging
      - run: pnpm test:live-smoke-budget
      - run: pnpm test:screening-kit
      - name: Native media fixtures (macOS)
        if: runner.os == 'macOS'
        run: pnpm test:mac-media
      - run: pnpm build
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Electron E2E
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Upload failed desktop test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            args: --linux AppImage --x64
          - name: windows-x64
            os: windows-2025
            args: --win nsis --x64
          - name: macos-arm64
            os: macos-15
            args: --mac dmg zip --arm64
          - name: macos-x64
            os: macos-15-intel
            args: --mac dmg zip --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-package-assets.mjs
      - run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke-test packaged Mac app
        if: runner.os == 'macOS'
        run: node scripts/verify-mac-package.mjs release --installers --source-match
      - uses: actions/upload-artifact@v4
        with:
          name: grudge-vault-${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: Publish installers
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: grudge-vault-*
          merge-multiple: true
          path: release/
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
      - name: Verify complete installer set and create checksums
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME" release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "Grudge Vault $tag" --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$tag" release/*.AppImage release/*.exe release/*.dmg release/*.zip release/SHA256SUMS --clobber
          gh release edit "$tag" --draft=false
