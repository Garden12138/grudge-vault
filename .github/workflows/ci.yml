name: Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Electron E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Electron E2E
        if: runner.os != 'Linux'
        run: pnpm test:e2e

  package:
    name: Package (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            args: --linux AppImage --x64
          - name: windows-x64
            os: windows-2025
            args: --win nsis --x64
          - name: macos-arm64
            os: macos-15
            args: --mac dmg zip --arm64
          - name: macos-x64
            os: macos-15-intel
            args: --mac dmg zip --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec electron-builder --config electron-builder.yml ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: grudge-vault-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
